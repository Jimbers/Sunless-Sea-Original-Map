<title>Isles of Darkness Relief</title>
<meta name="description" content="Interactive 3D relief of the Isles of Darkness, a sunless realm lit by its Candle Towers, castle fires and village hearths.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: full-bleed WebGL scene; one floating control panel (top-left), record card (bottom-left), labels as an HTML overlay.
   A single dark look by design: the realm has no sun. */
:root {
  --void: #04060a;
  --panel: rgba(14, 17, 23, 0.9);
  --ink: #ece4d2;
  --ink-dim: #9d978a;
  --flame: #f2c66d;
  --rule: rgba(242, 198, 109, 0.2);
  --f-serif: "EB Garamond", Garamond, "Iowan Old Style", Georgia, serif;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ink); font-family: var(--f-ui); font-size: 14px; overflow: hidden; }
[hidden] { display: none !important; }
#scene { position: absolute; inset: 0; }
#scene canvas { display: block; outline: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: var(--f-serif); color: #efe3c4; will-change: transform;
  text-shadow: 0 0 4px #000, 0 0 10px #000, 0 0 2px #000; }
.lbl.region { font-size: 15px; letter-spacing: .04em; }
.lbl.tower { font-size: 14px; font-style: italic; color: var(--flame); }
.lbl.town { font-size: 12px; color: #d9cdb2; }
.lbl.mark { font-size: 12px; font-style: italic; color: #b9c4cf; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; font: italic 1.25rem var(--f-serif); color: var(--ink-dim); text-align: center; padding: 0 24px; }

.panel { position: absolute; z-index: 2; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; width: 292px; max-width: calc(100vw - 32px);
  max-height: calc(100% - 32px); overflow: auto;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; box-shadow: 0 14px 40px rgba(0,0,0,.6); backdrop-filter: blur(6px); }
.panel header { padding: 14px 16px 10px; border-bottom: 1px solid var(--rule); }
.panel h1 { margin: 0; font: 500 1.6rem/1.05 var(--f-serif); color: var(--flame); text-wrap: balance; }
.panel .sub { margin: 4px 0 0; font: italic .98rem/1.3 var(--f-serif); color: var(--ink-dim); }
.controls { padding: 8px 16px 4px; display: grid; }
.sw { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; }
.sw span { font: 1.05rem var(--f-serif); }
.sw small { display: block; font: .74rem var(--f-ui); color: var(--ink-dim); margin-top: 1px; }
.toggle { appearance: none; width: 38px; height: 21px; border-radius: 11px; background: #2b313b; border: 1px solid var(--rule); position: relative; cursor: pointer; transition: background .2s; margin: 0; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--ink-dim); transition: transform .2s, background .2s; }
.toggle:checked { background: #6b5422; }
.toggle:checked::after { transform: translateX(17px); background: var(--flame); }
.toggle:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
.key { list-style: none; margin: 0; padding: 8px 16px 10px; border-top: 1px solid var(--rule); display: grid; gap: 5px; font-size: .84rem; }
.key li { display: grid; grid-template-columns: 14px 1fr auto; gap: 9px; align-items: center; }
.key i { width: 10px; height: 10px; border-radius: 50%; justify-self: center; }
.key i.banner { width: 10px; height: 15px; border-radius: 1px; border: 2.5px solid; box-sizing: border-box; box-shadow: 0 0 0 1px rgba(236,228,210,.25); }
.key .khead { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.key .ct { color: var(--ink-dim); font-variant-numeric: tabular-nums; font-size: .74rem; }
.panel footer { border-top: 1px solid var(--rule); padding: 9px 16px 11px; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { appearance: none; border: 1px solid var(--rule); background: transparent; color: var(--flame); border-radius: 3px; padding: 6px 10px; font: 1rem var(--f-serif); cursor: pointer; text-decoration: none; }
.btn:hover { background: rgba(242,198,109,.1); }
.hint { margin: 0; width: 100%; color: var(--ink-dim); font-size: .76rem; line-height: 1.4; }

.card { position: absolute; z-index: 2; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 330px; max-width: calc(100vw - 32px);
  max-height: 46vh; overflow: auto;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 13px 16px 12px; box-shadow: 0 14px 40px rgba(0,0,0,.6); }
.card h2 { margin: 0 22px 1px 0; font: 500 1.45rem/1.1 var(--f-serif); color: var(--flame); }
.card .where { margin: 0 0 9px; font: italic 1rem var(--f-serif); color: var(--ink-dim); }
.card dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: .86rem; }
.card dt { color: var(--ink-dim); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; padding-top: 2px; }
.card dd { margin: 0; min-width: 0; font-variant-numeric: tabular-nums; line-height: 1.35; }
.card .x { position: absolute; top: 8px; right: 8px; appearance: none; border: 0; background: none; color: var(--ink-dim); font-size: 20px; cursor: pointer; line-height: 1; padding: 2px 6px; }
.card .x:hover { color: var(--flame); }
.meter { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: #252a33; vertical-align: middle; margin-right: 6px; overflow: hidden; }
.meter b { display: block; height: 100%; background: linear-gradient(90deg, #6b5422, var(--flame)); }

@media (max-width: 560px) {
  .panel { right: 16px; width: auto; }
  .panel h1 { font-size: 1.3rem; }
  .key, .hint { display: none; }
  .card { right: 16px; width: auto; }
}
</style>

<div id="scene"></div>
<div id="labels"></div>
<div id="loading">Kindling the Candle Towers…</div>

<aside class="panel" aria-label="Relief controls">
  <header>
    <h1>The Isles of Darkness</h1>
    <p class="sub">A sunless realm lit by four Candle Towers. About 1,000 km across; relief exaggerated <span id="exag">8</span>×.</p>
  </header>
  <div class="controls">
    <label class="sw" for="sun"><div><span>Sun</span><small>Light the whole realm to read the land</small></div><input class="toggle" type="checkbox" id="sun"></label>
    <label class="sw" for="lbls"><div><span>Names</span><small>Regions, towers, castles and landmarks</small></div><input class="toggle" type="checkbox" id="lbls" checked></label>
  </div>
  <ul class="key" id="key"></ul>
  <footer>
    <button type="button" class="btn" id="reset">Reset view</button>
    <a class="btn" href="../" id="back">Flat map</a>
    <p class="hint">Drag to pan, right-drag to orbit, scroll to zoom. Click the land for its record.</p>
  </footer>
</aside>

<div class="card" id="card" hidden aria-live="polite">
  <button type="button" class="x" id="cardx" aria-label="Close">×</button>
  <div id="cardbody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CANDLE = [1.0, 0.82, 0.52], FIRE = [1.0, 0.52, 0.2], LAVA = [1.0, 0.28, 0.08], ELECTRIC = [1.0, 0.9, 0.7], HEARTH = [1.0, 0.6, 0.28];
// outer colours of each house's two-stroke boundary in the QGIS symbology (inner colours are HOUSE_COL)
const HOUSE_EDGE = { "Outer Blood": "#002673", "Vale": "#002673", "Steelheart": "#000000", "Werebrand": "#ffffff", "Longservant": "#a87000",
  "Giantsbane": "#ff00c5", "Yyrodh Abbey": "#000000", "Sel Serro Abbey": "#f2d22e" };
const HOUSE_COL = { "Outer Blood": 0xa80000, "Vale": 0x00734c, "Steelheart": 0xe60000, "Werebrand": 0xe69800, "Longservant": 0xffffff,
  "Giantsbane": 0x4ce600, "Yyrodh Abbey": 0x101010, "Sel Serro Abbey": 0xf2d22e, "Foundling": 0x000000, "Reedland": 0xffffff, "Northern Court": 0xffebbe };

const loadImage = (url) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(url)); i.src = url; });
function pixels(img) {
  const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
  const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(img, 0, 0);
  return x.getImageData(0, 0, img.width, img.height).data;
}
Promise.all([fetch("data/meta.json").then((r) => { if (!r.ok) throw new Error("meta.json " + r.status); return r.json(); }),
  loadImage("data/height.png"), loadImage("data/ids.png"), loadImage("data/light.png"), loadImage("data/albedo.jpg")])
  .then((a) => start(...a))
  .catch((e) => { $("#loading").textContent = "The relief could not be loaded (" + e.message + "). Serve the folder over http rather than opening the file directly."; });

function start(meta, himg, idimg, limg, aimg) {
  const [W, H] = meta.extent_m, [NX, NY] = meta.grid, VF = meta.vf, RS = meta.realScale;
  const hp = pixels(himg), HM = new Float32Array(NX * NY);
  for (let i = 0; i < NX * NY; i++) HM[i] = (hp[i * 4] * 256 + hp[i * 4 + 1]) / 10 - 1000;
  const idp = pixels(idimg), lp = pixels(limg);
  const hAt = (u, v) => {
    const x = Math.min(NX - 1.001, Math.max(0, u * (NX - 1))), y = Math.min(NY - 1.001, Math.max(0, v * (NY - 1)));
    const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0, i = y0 * NX + x0;
    return (HM[i] * (1 - fx) + HM[i + 1] * fx) * (1 - fy) + (HM[i + NX] * (1 - fx) + HM[i + NX + 1] * fx) * fy;
  };
  const hW = (x, z) => hAt(x / W + 0.5, z / H + 0.5);            // real metres at world x,z
  const surf = (h) => h * VF;
  const toWorld = (uv) => [(uv[0] - 0.5) * W, (uv[1] - 0.5) * H];

  // ---- renderer ----
  const host = $("#scene");
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setSize(host.clientWidth, host.clientHeight);
  host.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, host.clientWidth / host.clientHeight, 20, 400000);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, maxPolarAngle: 1.42, minDistance: 500, maxDistance: 75000, screenSpacePanning: false });
  controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
  $("#exag").textContent = meta.exag;

  const uniforms = {
    uTime: { value: 0 }, uSun: { value: 0 }, uSunDir: { value: new THREE.Vector3(-0.45, 0.75, -0.48).normalize() },
    uLight: { value: null }, uAlbedo: { value: null }, uFogCol: { value: new THREE.Color(0x04060a) }, uFogDen: { value: 0.000028 },
    uExt: { value: new THREE.Vector2(W, H) },
    uCandle: { value: new THREE.Vector3(...CANDLE) }, uCandleK: { value: 1 }, uFire: { value: new THREE.Vector3(...FIRE) }, uLava: { value: new THREE.Vector3(...LAVA) }
  };
  const tex = (img) => { const t = new THREE.Texture(img); t.needsUpdate = true; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; };
  uniforms.uAlbedo.value = tex(aimg); uniforms.uLight.value = tex(limg);

  const COMMON = `
    uniform sampler2D uLight; uniform float uTime; uniform float uSun; uniform vec3 uSunDir;
    uniform vec3 uFogCol; uniform float uFogDen; uniform vec2 uExt;
    uniform vec3 uCandle; uniform vec3 uFire; uniform vec3 uLava; uniform float uCandleK;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    vec3 realmLight(vec3 wp) {
      vec2 uv = vec2(wp.x / uExt.x + 0.5, 0.5 - wp.z / uExt.y);
      if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return vec3(0.0);
      vec3 l = texture2D(uLight, uv).rgb; l = l * l * 2.0;
      float cell = hash(floor(wp.xz / 900.0));
      float fl = 0.86 + 0.08 * sin(uTime * 7.3 + cell * 40.0) + 0.06 * sin(uTime * 13.1 + cell * 17.0);
      float can = 0.95 + 0.05 * sin(uTime * 1.7 + cell * 3.0);
      float lav = 0.8 + 0.2 * sin(uTime * 0.9 + cell * 6.0);
      return l.r * uCandle * can * 0.7 * uCandleK + l.g * uFire * fl + l.b * uLava * lav;     // Candle Towers 30% dimmer
    }
    vec3 finish(vec3 c, float dist) {
      c = c / (1.0 + c * 0.85) * 1.25;
      c = pow(max(c, 0.0), vec3(1.0 / 2.2));
      return mix(c, uFogCol, clamp(1.0 - exp(-dist * uFogDen), 0.0, 1.0));
    }`;

  // ---- terrain ----
  const SX = 2, segX = Math.floor((NX - 1) / SX), segY = Math.floor((NY - 1) / SX);
  const geo = new THREE.PlaneGeometry(W, H, segX, segY); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, uvA = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) pos.setY(i, surf(hAt(uvA.getX(i), 1 - uvA.getY(i))));
  geo.computeVertexNormals();
  const terrain = new THREE.Mesh(geo, new THREE.ShaderMaterial({
    uniforms,
    vertexShader: `varying vec2 vUv; varying vec3 vN; varying vec3 vW;
      void main() { vUv = uv; vN = normal; vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: COMMON + `uniform sampler2D uAlbedo; varying vec2 vUv; varying vec3 vN; varying vec3 vW;
      void main() {
        vec3 a = pow(texture2D(uAlbedo, vUv).rgb, vec3(2.2));
        vec3 n = normalize(vN);
        vec3 sun = uSun * (vec3(0.18, 0.2, 0.24) + vec3(1.0, 0.96, 0.9) * 1.15 * max(dot(n, uSunDir), 0.0));
        vec3 c = a * (vec3(0.010, 0.013, 0.02) + realmLight(vW) * 1.25 + sun);
        vec3 lv = texture2D(uLight, vUv).rgb; c += uLava * pow(lv.b, 6.0) * 1.6 * (0.8 + 0.2 * sin(uTime * 1.3));
        gl_FragColor = vec4(finish(c, distance(cameraPosition, vW)), 1.0);
      }`
  }));
  scene.add(terrain);

  // ---- water ----
  const water = new THREE.Mesh(new THREE.PlaneGeometry(W * 8, H * 8, 1, 1).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
    uniforms,
    vertexShader: `varying vec3 vW; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: COMMON + `varying vec3 vW;
      float n2(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
      void main() {
        vec3 L = realmLight(vW);
        float r = n2(vW.xz / 900.0 + vec2(uTime * 0.01, uTime * 0.006));
        float glint = 0.0;
        vec3 c = vec3(0.003, 0.007, 0.013) + L * vec3(0.55, 0.62, 0.75) * (0.05 + 0.03 * r);
        vec3 V = normalize(cameraPosition - vW);
        c += uSun * (vec3(0.05, 0.13, 0.2) + vec3(0.5, 0.55, 0.6) * pow(1.0 - max(V.y, 0.0), 4.0) * 0.4 + vec3(0.9) * glint * 0.03);
        gl_FragColor = vec4(finish(c, distance(cameraPosition, vW)), 1.0);
      }`
  }));
  water.position.y = 0.6; scene.add(water);

  // ---- instanced structures, lit by the same light field ----
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = mulberry(1234), pick = (arr) => arr[(rnd() * arr.length) | 0];
  const instMat = () => new THREE.ShaderMaterial({
    uniforms,
    vertexShader: `varying vec3 vC; varying vec3 vW; varying vec3 vN;
      void main() { vec4 w = modelMatrix * instanceMatrix * vec4(position, 1.0); vW = w.xyz;
        vN = normalize(mat3(modelMatrix * instanceMatrix) * normal); vC = instanceColor;
        gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: COMMON + `varying vec3 vC; varying vec3 vW; varying vec3 vN;
      void main() { vec3 a = pow(vC, vec3(2.2)); vec3 n = normalize(vN);
        vec3 L = realmLight(vW) * (0.55 + 0.45 * max(n.y, 0.3));
        vec3 sun = uSun * (vec3(0.2) + vec3(1.0, 0.96, 0.9) * max(dot(n, uSunDir), 0.0));
        gl_FragColor = vec4(finish(a * (vec3(0.012) + L * 1.4 + sun), distance(cameraPosition, vW)), 1.0); }`
  });
  const GEOS = {
    box: new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0),
    hip: new THREE.ConeGeometry(0.78, 1, 4, 1).rotateY(Math.PI / 4).translate(0, 0.5, 0),
    gable: (() => { const g = new THREE.CylinderGeometry(0.62, 0.62, 1, 3, 1).rotateZ(Math.PI / 2).rotateX(Math.PI / 6); g.translate(0, 0.3, 0); return g; })(),
    cyl: new THREE.CylinderGeometry(0.5, 0.5, 1, 10).translate(0, 0.5, 0),
    cone: new THREE.ConeGeometry(0.5, 1, 7).translate(0, 0.5, 0),
    pyr: new THREE.ConeGeometry(0.72, 1, 4).rotateY(Math.PI / 4).translate(0, 0.5, 0),
    rib: new THREE.TorusGeometry(0.5, 0.05, 5, 14, Math.PI),
    whale: new THREE.SphereGeometry(0.5, 14, 8),
    ico: new THREE.IcosahedronGeometry(0.5, 0).translate(0, 0.5, 0),
  };
  const lists = Object.fromEntries(Object.keys(GEOS).map((k) => [k, []]));
  // put(kind, x, z, w, h, d, rotY, color, yOff, {ry, rx, rz, abs, water})
  function put(kind, x, z, w, hh, d, rot, color, yOff = 0, o = {}) {
    const g = hW(x, z);
    if (!o.water && g < 2) return false;
    const y = (o.abs !== undefined ? o.abs : surf(Math.max(g, 0))) + yOff;
    lists[kind].push([x, y, z, w, hh, d, rot, color, o.rx || 0, o.rz || 0]); return true;
  }
  const PALETTE = {
    eastern: { wall: [0xd8cbb0, 0xc9b896, 0xe2d6bc], roof: [0x3c3f46, 0x4a3f3a, 0x2f3a3d, 0x5a3b30] },
    european: { wall: [0xbfb3a0, 0xa89a84, 0xcfc4b0], roof: [0x7a3b26, 0x5a3a2a, 0x8a4a2e] },
    outer: { wall: [0x4d4a4a, 0x5a5552, 0x403c3c], roof: [0x2a2525, 0x3a2222] },
    bylong: { wall: [0xe8e2d4, 0xd9dde0, 0xc8d2d8, 0xf0ece2], roof: [0x5c6b78] }
  };
  function cluster(cx, cz, radius, n, style, k = 1) {
    const pal = PALETTE[style], ang = rnd() * Math.PI;
    for (let i = 0; i < n; i++) {
      const r = radius * Math.sqrt(rnd()), a = rnd() * Math.PI * 2, x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r;
      const w = (18 + rnd() * 16) * k, d = (14 + rnd() * 12) * k, hh = (10 + rnd() * 8) * k, rot = ang + (rnd() < .7 ? 0 : Math.PI / 2);
      if (!put("box", x, z, w, hh, d, rot, pick(pal.wall))) continue;
      if (style === "european") put("gable", x, z, w * 1.05, hh * 1.1, d * 1.05, rot, pick(pal.roof), hh);
      else if (style !== "bylong") put("hip", x, z, Math.max(w, d) * 1.3, hh * 0.75, Math.max(w, d) * 1.3, rot, pick(pal.roof), hh);
    }
  }
  function castle(cx, cz, style, house, big) {
    const pal = PALETTE[style], s = big ? 1.5 : 1.1;
    if (style === "european") {
      put("box", cx, cz, 70 * s, 90 * s, 70 * s, 0, pick(pal.wall));
      for (const [dx, dz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { put("cyl", cx + dx * 55 * s, cz + dz * 55 * s, 30 * s, 120 * s, 30 * s, 0, pick(pal.wall)); put("cone", cx + dx * 55 * s, cz + dz * 55 * s, 36 * s, 40 * s, 36 * s, 0, 0x5a3a2a, 120 * s); }
    } else {
      let w = 90 * s, y = 0;
      for (let t = 0; t < 4; t++) {                                   // tiered keep, a hipped roof at every level
        put("box", cx, cz, w, 34 * s, w, Math.PI / 4, t ? 0xe9e0cc : 0x8a8478, y);
        put("hip", cx, cz, w * 1.45, 18 * s, w * 1.45, Math.PI / 4, style === "outer" ? 0x2a2525 : 0x2f3540, y + 34 * s);
        y += 40 * s; w *= 0.74;
      }
    }
    const R = (style === "outer" ? 210 : 160) * s, segs = style === "outer" ? 22 : 16;
    for (let k = 0; k < segs; k++) {

  for (const [k, arr] of Object.entries(lists)) {
    if (!arr.length) continue;
    const im = new THREE.InstancedMesh(GEOS[k], instMat(), arr.length);
    const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new THREE.Vector3(), P = new THREE.Vector3(), E = new THREE.Euler();
    arr.forEach(([x, y, z, w, hh, d, rot, color, rx, rz], i) => {
      P.set(x, y, z); Q.setFromEuler(E.set(rx, rot, rz, "YXZ")); S.set(w, hh, d);
      M.compose(P, Q, S); im.setMatrixAt(i, M); im.setColorAt(i, new THREE.Color(color));
    });
    im.instanceMatrix.needsUpdate = true; im.instanceColor.needsUpdate = true; im.frustumCulled = false; scene.add(im);
  }
  // whales: animated, so their own instanced mesh
  const whaleMesh = new THREE.InstancedMesh(GEOS.whale, instMat(), whaleObjs.length * 2);
  whaleMesh.frustumCulled = false; scene.add(whaleMesh);
  whaleObjs.forEach((_, i) => { whaleMesh.setColorAt(i * 2, new THREE.Color(0x2a3036)); whaleMesh.setColorAt(i * 2 + 1, new THREE.Color(0x2a3036)); });
  whaleMesh.instanceColor.needsUpdate = true;
  function updateWhales(t) {
    const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new THREE.Vector3(), P = new THREE.Vector3(), E = new THREE.Euler();
    whaleObjs.forEach((w, i) => {
      const bob = Math.sin(t * 0.35 + w.ph);
      P.set(w.x, -40 + bob * 34, w.z); Q.setFromEuler(E.set(0, w.rot, 0)); S.set(90, 60, 420); M.compose(P, Q, S); whaleMesh.setMatrixAt(i * 2, M);
      const fx = w.x - Math.sin(w.rot) * 230, fz = w.z - Math.cos(w.rot) * 230;                   // fluke
      P.set(fx, -10 + Math.sin(t * 0.35 + w.ph - 1.2) * 46, fz); S.set(220, 14, 70); M.compose(P, Q, S); whaleMesh.setMatrixAt(i * 2 + 1, M);
    });
    whaleMesh.instanceMatrix.needsUpdate = true;
  }
  if (whaleObjs.length) marks.push({ x: whaleObjs[0].x, y: 200, z: whaleObjs[0].z, t: "Great whales of the Abyss" });

  // ---- light points, glow sprites, lighthouse beams, the Black Fume's smoke ----
  function pointsLayer(items, k, blending = THREE.AdditiveBlending, dark = false) {
    const g = new THREE.BufferGeometry();
    const p = new Float32Array(items.length * 3), c = new Float32Array(items.length * 3), s = new Float32Array(items.length), ph = new Float32Array(items.length);
    items.forEach((it, i) => { p.set([it[0], it[1], it[2]], i * 3); c.set(it[3], i * 3); s[i] = it[4]; ph[i] = it[5]; });
    g.setAttribute("position", new THREE.BufferAttribute(p, 3)); g.setAttribute("lcol", new THREE.BufferAttribute(c, 3));
    g.setAttribute("size", new THREE.BufferAttribute(s, 1)); g.setAttribute("phase", new THREE.BufferAttribute(ph, 1));
    const m = new THREE.ShaderMaterial({
      uniforms: { uTime: uniforms.uTime, uScale: { value: renderer.domElement.height / 2 }, uK: { value: k }, uSunFade: { value: 1 }, uMul: { value: 1 } },
      vertexShader: `attribute float size; attribute float phase; attribute vec3 lcol; uniform float uTime; uniform float uScale; varying vec3 vC; varying float vF;
        void main() { vec3 p = position; ${dark ? "p.y += mod(uTime * 18.0 + phase * 40.0, 900.0); p.x += mod(uTime * 18.0 + phase * 40.0, 900.0) * 0.9;" : ""}
          vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_Position = projectionMatrix * mv;
          vF = ${dark ? "1.0 - mod(uTime * 18.0 + phase * 40.0, 900.0) / 900.0" : "0.82 + 0.12 * sin(uTime * 6.0 + phase) + 0.06 * sin(uTime * 11.0 + phase * 2.3)"}; vC = lcol;
          gl_PointSize = clamp(size * uScale / -mv.z, 0.0, 1024.0); }`,
      fragmentShader: `uniform float uK; uniform float uSunFade; uniform float uMul; varying vec3 vC; varying float vF;
        void main() { float d = length(gl_PointCoord - 0.5) * 2.0; float a = pow(max(1.0 - d, 0.0), 2.2);
          ${dark ? "gl_FragColor = vec4(vC * (0.6 + 0.4 * (1.0 - d)), a * 0.32 * vF);" : "float core = pow(max(1.0 - d * 2.6, 0.0), 3.0); gl_FragColor = vec4(vC * (a * uK + core * 1.4) * vF * uSunFade * uMul, 1.0);"} }`,
      transparent: true, depthWrite: false, blending
    });
    const pts = new THREE.Points(g, m); pts.frustumCulled = false; scene.add(pts); return m;
  }
  const winMat = pointsLayer(lightPts, 0.55);
  const glowMat = pointsLayer(glows.filter((g) => g.k !== "candle").map((g, i) => [g.x, g.y, g.z, g.col.map((v) => v * 0.55), g.size, i * 7.1]), 0.5);
  const coreMat = pointsLayer(glows.filter((g) => g.core && g.k !== "candle").map((g, i) => [g.x, g.y, g.z, [1, 0.95, 0.8], g.core, i * 3.3]), 1.2);
  // the Candle Towers' own flames, on their slow two-minute cycle
  const candleGlowMat = pointsLayer(glows.filter((g) => g.k === "candle").map((g, i) => [g.x, g.y, g.z, g.col.map((v) => v * 0.9), g.size, i * 7.1]), 0.5);
  const candleCoreMat = pointsLayer(glows.filter((g) => g.k === "candle").map((g, i) => [g.x, g.y, g.z, [1, 0.95, 0.8], g.core, i * 3.3]), 1.2);
  const smoke = [];
  for (const uv of LM.smoke) { const [x, z] = toWorld(uv); const y0 = surf(Math.max(hW(x, z), 0)) + 200;
    for (let i = 0; i < 26; i++) smoke.push([x + (rnd() - .5) * 300, y0 + rnd() * 200, z + (rnd() - .5) * 300, [0.16, 0.14, 0.13], 1200 + rnd() * 1400, i * 0.8 + rnd()]); }
  const smokeMat = smoke.length ? pointsLayer(smoke, 1, THREE.NormalBlending, true) : null;
  if (LM.smoke.length) marks.push({ uv: LM.smoke[0], t: "The Black Fume", y: 1800 });
  const beamMeshes = beams.map((b) => {                       // sweeping lighthouse beams
    const g = new THREE.ConeGeometry(120, 2600, 24, 1, true).translate(0, -1300, 0).rotateZ(Math.PI / 2);
    const m = new THREE.Mesh(g, new THREE.ShaderMaterial({
      uniforms: { uSunFade: { value: 1 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      vertexShader: `varying float vX; void main() { vX = -position.x / 2600.0; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `uniform float uSunFade; varying float vX; void main() { gl_FragColor = vec4(vec3(1.0, 0.86, 0.6) * 0.07 * pow(1.0 - clamp(vX, 0.0, 1.0), 2.5) * uSunFade, 1.0); }`
    }));
    m.position.set(b.x, b.y, b.z); scene.add(m); return m;
  });

  // ---- labels ----
  const labelHost = $("#labels"), labels = [];
  const addLabel = (x, y, z, text, cls, far, pri) => {
    const el = document.createElement("div"); el.className = "lbl " + cls; el.textContent = text; labelHost.appendChild(el);
    labels.push({ el, p: new THREE.Vector3(x, y, z), far, pri, w: 0 });
  };
  for (const t of towers) addLabel(t.x, t.y + 420, t.z, t.name, "tower", 120000, 0);
  for (const t of townLabels) addLabel(t.x, surf(Math.max(hW(t.x, t.z), 0)) + 180, t.z, t.t, "town", 16000, 1);
  for (const m of marks) { const [x, z] = m.uv ? toWorld(m.uv) : [m.x, m.z]; addLabel(x, m.y !== undefined && !m.uv ? m.y : surf(Math.max(hW(x, z), 0)) + (m.y || 260), z, m.t, "mark", 22000, 2); }
  for (const r of meta.regions) { const [x, z] = toWorld(r.uv); addLabel(x, surf(Math.max(hW(x, z), 0)) + 250, z, r.t, "region", 38000, 3); }
  labels.sort((a, b) => a.pri - b.pri);
  const V3 = new THREE.Vector3();
  function placeLabels() {
    if (!$("#lbls").checked) { labelHost.style.display = "none"; return; }
    labelHost.style.display = "";
    const w = host.clientWidth, h = host.clientHeight, boxes = [];
    for (const L of labels) {
      const dist = camera.position.distanceTo(L.p);
      V3.copy(L.p).project(camera);
      if (!(V3.z < 1 && dist < L.far && Math.abs(V3.x) < 1.1 && Math.abs(V3.y) < 1.1)) { L.el.style.opacity = 0; continue; }
      if (!L.w) L.w = L.el.offsetWidth || 80;
      const x = (V3.x + 1) / 2 * w, y = (1 - V3.y) / 2 * h;
      const box = [x - L.w / 2, y - 9, x + L.w / 2, y + 9];
      if (boxes.some((b) => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) { L.el.style.opacity = 0; continue; }
      boxes.push(box);
      L.el.style.transform = `translate(${(x - L.w / 2).toFixed(1)}px, ${(y - 9).toFixed(1)}px)`;
      L.el.style.opacity = String(Math.min(1, (L.far - dist) / (L.far * 0.25)));
    }
  }

  // ---- key: the houses, in the colours flown from their castles ----
  const hcount = {}, hcastles = {};
  meta.territories.forEach((t) => { if (t.h) hcount[t.h] = (hcount[t.h] || 0) + 1; });
  meta.settlements.forEach((st) => { if (st.castle && st.house) hcastles[st.house] = (hcastles[st.house] || 0) + 1; });
  const hex = (n) => "#" + n.toString(16).padStart(6, "0");
  $("#key").innerHTML = '<li class="khead"><span></span><span>Houses</span><span class="ct">castles</span></li>' +
    Object.keys(hcount).filter((h) => HOUSE_COL[h] !== undefined).sort((a, b) => hcount[b] - hcount[a])
      .map((h) => `<li><i class="banner" style="background:${hex(HOUSE_COL[h])};border-color:${HOUSE_EDGE[h] || "#ece4d2"}"></i><span>${esc(h)}</span><span class="ct">${hcastles[h] || 0}</span></li>`).join("");

  // ---- picking ----
  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
  let downAt = null;
  renderer.domElement.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener("pointerup", (e) => {
    if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
    const r = renderer.domElement.getBoundingClientRect();
    mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    const hit = ray.intersectObject(terrain)[0];
    if (!hit) return;
    const u = hit.uv.x, v = 1 - hit.uv.y;
    const px = Math.min(NX - 1, Math.floor(u * NX)), py = Math.min(NY - 1, Math.floor(v * NY)), k = (py * NX + px) * 4;
    const id = idp[k] * 256 + idp[k + 1], elev = hAt(u, v);
    const lr = lp[k] / 255, lg = lp[k + 1] / 255, lb = lp[k + 2] / 255;
    const lux = Math.min(1, (lr * lr + lg * lg + lb * lb) * 2 / 1.2);
    const word = lux > 0.45 ? "Bright" : lux > 0.18 ? "Lit" : lux > 0.05 ? "Dim" : "Dark";
    const t = id ? meta.territories[id - 1] : null, rows = [];
    if (t) {
      if (t.h) rows.push(["House", t.h]);
      if (t.t) rows.push(["Terrain", t.t === "It's a Hecking Volcano" ? "Volcano" : t.t]);
      if (t.c) rows.push(["Castle", t.c]);
      if (t.w && !/None|See above/.test(t.w)) rows.push(["Town", t.w]);
      if (t.s && !/^Port$/.test(t.s)) rows.push(["Lore", t.s.length > 260 ? t.s.slice(0, 257) + "…" : t.s]);
    }
    rows.push(["Elevation", elev > 0 ? Math.round(elev).toLocaleString("en-US") + " m" : "Sea, " + Math.round(-elev) + " m deep"]);
    rows.push(["Light", `<span class="meter"><b style="width:${Math.round(lux * 100)}%"></b></span>${word}`]);
    $("#cardbody").innerHTML = `<h2>${esc(t ? t.n || "Unnamed" : elev > 0 ? "An unnamed isle" : "Open water")}</h2>
      <p class="where">${t ? esc([t.r, t.a].filter(Boolean).join(" · ")) : elev > 0 ? "One of the score uncharted" : "Beyond the territories"}</p>
      <dl>${rows.map(([a, b]) => `<dt>${a}</dt><dd>${a === "Light" ? b : esc(b)}</dd>`).join("")}</dl>`;
    $("#card").hidden = false;
  });
  $("#cardx").addEventListener("click", () => { $("#card").hidden = true; });

  // ---- view, controls, loop ----
  const home = () => {
    const [mx, mz] = toWorld([0.47, 0.5]);
    controls.target.set(mx, 0, mz); camera.position.set(mx + 2500, 21000, mz + 26000); controls.update();
  };
  home();
  $("#reset").addEventListener("click", home);
  fetch("../index.html", { method: "HEAD" }).then((r) => { if (!r.ok) throw 0; }).catch(() => {
    const b = $("#back"); b.href = "https://claude.ai/artifact/6gDgP3a6sm4KANoP4rBkct"; b.target = "_blank"; b.rel = "noopener"; });
  const fades = [winMat, glowMat, coreMat, candleGlowMat, candleCoreMat, ...beamMeshes.map((b) => b.material)];
  $("#sun").addEventListener("change", (e) => {
    const on = e.target.checked;
    uniforms.uSun.value = on ? 1 : 0;
    uniforms.uFogCol.value.set(on ? 0x6f8597 : 0x04060a);
    uniforms.uFogDen.value = on ? 0.000014 : 0.000028;
    renderer.setClearColor(uniforms.uFogCol.value);
    for (const m of fades) m.uniforms.uSunFade.value = on ? 0.35 : 1;
  });
  renderer.setClearColor(uniforms.uFogCol.value);
  $("#lbls").addEventListener("change", placeLabels);
  window.addEventListener("resize", () => {
    renderer.setSize(host.clientWidth, host.clientHeight);
    camera.aspect = host.clientWidth / host.clientHeight; camera.updateProjectionMatrix();
    for (const m of [winMat, glowMat, coreMat, candleGlowMat, candleCoreMat, smokeMat]) if (m) m.uniforms.uScale.value = renderer.domElement.height / 2;
  });
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clock = new THREE.Clock();
  $("#loading").hidden = true;
  (function loop() {
    requestAnimationFrame(loop);
    const t = reduce ? 0 : clock.getElapsedTime();
    uniforms.uTime.value = t;
    // Candle Towers wax and wane: full brightness down to 25% and back, every two minutes
    const ck = 0.625 + 0.375 * Math.cos(t * Math.PI * 2 / 120);
    uniforms.uCandleK.value = ck; candleGlowMat.uniforms.uMul.value = ck; candleCoreMat.uniforms.uMul.value = 0.4 + 0.6 * ck;
    beamMeshes.forEach((b, i) => { b.rotation.y = t * 0.6 + i * 2.1; });
    if (whaleObjs.length) updateWhales(t);
    controls.update();
    const floor = surf(Math.max(hW(camera.position.x, camera.position.z), 0)) + 150;
    if (camera.position.y < floor) camera.position.y = floor;
    renderer.render(scene, camera);
    placeLabels();
  })();
  window.__three = { camera, controls, scene, uniforms };
}
})();
</script>
